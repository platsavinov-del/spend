<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E252C">
<title>Spend Challenge</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#1E252C; --card:#28323B; --line:#3A4854; --ink:#EEF1F3;
    --dim:#8FA0AD; --good:#8FBF7A; --bad:#DE7B60; --accent:#C8A24A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:max(20px,env(safe-area-inset-top)) 16px 48px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto}
  .mono{font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:6px 0 0}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .hero{background:var(--card);border-radius:16px;padding:20px;margin:18px 0 14px;
    border:1px solid var(--line)}
  .hero .lbl{font-size:12px;color:var(--dim)}
  .hero .num{font-size:46px;font-weight:500;letter-spacing:-.03em;margin-top:4px}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
    background:var(--accent);color:#20262B;vertical-align:middle;margin-left:10px;font-weight:600}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;background:var(--good);transition:width .4s}
  .row-in{display:flex;gap:8px;margin-bottom:6px}
  .field{position:relative;flex:1;min-width:0}
  .field span{position:absolute;left:12px;top:13px;color:var(--dim)}
  input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 12px 13px 27px;color:var(--ink);font-size:17px;outline:none}
  input:focus{border-color:var(--good)}
  button{background:var(--good);color:#1D242A;border:0;border-radius:12px;
    padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);color:var(--dim);
    width:100%;padding:11px;font-weight:400;margin-top:8px}
  .status{font-size:12px;color:var(--dim);min-height:16px;margin-bottom:14px}
  .status.err{color:var(--bad)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-bottom:3px}
  .stat i{font-style:normal;font-size:19px}
  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    margin:26px 0 6px;font-weight:500}
  .day{display:flex;align-items:center;gap:10px;padding:10px 2px;
    border-bottom:1px solid var(--line);font-size:14px}
  .day.today{background:linear-gradient(90deg,rgba(200,162,74,.13),transparent);
    border-radius:8px;padding-left:8px}
  .day .d{width:64px;color:var(--dim)}
  .day .a{flex:1;text-align:right;color:var(--dim)}
  .day .s{width:74px;text-align:right}
  .day .s.na{color:var(--dim)}
  .day .s.ok{color:var(--good)}
  .day .s.no{color:var(--bad)}
  .day.future{opacity:.35}
  dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:14px;max-width:420px;padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
</style>

<div class="wrap">
  <div class="eyebrow">12 Aug — 11 Sep</div>
  <h1>Spend Challenge</h1>

  <div class="hero">
    <div class="lbl" id="heroLbl">Allowance today</div>
    <div class="num mono" id="heroNum">—</div>
    <div class="bar"><i id="bar" style="width:0"></i></div>
  </div>

  <div class="row-in">
    <label class="field"><span>£</span>
      <input id="amt" inputmode="decimal" placeholder="0.00" class="mono">
    </label>
    <button id="log">Log</button>
  </div>
  <div class="status" id="status">Starting…</div>

  <div class="stats">
    <div class="stat"><b>Spent so far</b><i class="mono" id="sSpent">—</i></div>
    <div class="stat"><b>Budget left</b><i class="mono" id="sLeft">—</i></div>
    <div class="stat"><b>vs schedule</b><i class="mono" id="sDiff">—</i></div>
    <div class="stat"><b>Projected savings</b><i class="mono" id="sProj">—</i></div>
  </div>

  <h2>Ledger</h2>
  <div id="ledger"></div>

  <button class="ghost" id="undo">Undo last entry</button>
  <button class="ghost" id="exp">Export backup (JSON)</button>
</div>

<dialog id="dlg"></dialog>

<script>
// ─── CONFIG ────────────────────────────────────────────────
// Leave blank to store locally on this device only.
// Fill both to sync between phone and laptop.
const SUPABASE_URL = "https://helajsuxtjzxfcbwjdqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_TD2HOG6IkwkuYaaLfs6dhg_LaZZCmek";
// ───────────────────────────────────────────────────────────

const TOTAL = 442, TARGET = 300;
const LONDON = {"2026-08-14":20,"2026-08-15":45,"2026-08-16":45};
const DAYS = (()=>{const o=[],d=new Date("2026-08-12T12:00:00Z"),e=new Date("2026-09-11T12:00:00Z");
  while(d<=e){o.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);}return o;})();
const money = n => "£" + n.toFixed(2);
const lbl = s => new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const todayISO = () => { const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

const remote = !!(SUPABASE_URL && SUPABASE_KEY);
let log = {};

const sb = (path, opts={}) => fetch(SUPABASE_URL+"/rest/v1/"+path, {
  ...opts, headers:{apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json", Prefer:"resolution=merge-duplicates", ...(opts.headers||{})}});

async function load(){
  if(remote){
    const r = await sb("spend_days?select=day,amount");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const rows = await r.json();
    log = Object.fromEntries(rows.map(x=>[x.day, Number(x.amount)]));
  } else {
    log = JSON.parse(localStorage.getItem("spend-challenge") || "{}");
  }
}
async function persist(day, amount){
  if(remote){
    const r = await sb("spend_days", {method:"POST", body:JSON.stringify({day, amount})});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else {
    localStorage.setItem("spend-challenge", JSON.stringify(log));
  }
}
async function remove(day){
  if(remote){
    const r = await sb("spend_days?day=eq."+day, {method:"DELETE"});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else {
    localStorage.setItem("spend-challenge", JSON.stringify(log));
  }
}

function engine(){
  let spent=0, skim=0; const rows=[];
  for(const day of DAYS){
    const left = TOTAL - spent - skim;
    const ahead = DAYS.filter(d => d>=day && log[d]===undefined);
    const lond = ahead.reduce((a,d)=>a+(LONDON[d]||0),0);
    const norm = ahead.filter(d=>!LONDON[d]).length;
    const allow = LONDON[day] ?? (norm>0 ? Math.max((left-lond)/norm,0) : 0);
    const v = log[day];
    if(v===undefined){ rows.push({day,allow,spend:null}); continue; }
    const diff = allow - v;
    if(diff>0) skim += diff*0.3;
    spent += v;
    rows.push({day,allow,spend:v,diff});
  }
  return {rows, spent, skim, left: TOTAL-spent-skim, proj: TARGET+skim};
}

function targetDay(){ return DAYS.find(d=>log[d]===undefined) || DAYS[DAYS.length-1]; }

function render(){
  const {rows,spent,left,proj} = engine();
  const t = targetDay();
  const row = rows.find(r=>r.day===t);
  document.getElementById("heroLbl").textContent = "Allowance for " + lbl(t);
  document.getElementById("heroNum").innerHTML = money(row.allow) +
    (LONDON[t] ? '<span class="pill">London</span>' : "");
  const done = rows.filter(r=>r.spend!==null);
  const sched = done.reduce((a,r)=>a+r.diff,0);
  document.getElementById("bar").style.width = Math.min(100, done.length/DAYS.length*100)+"%";
  document.getElementById("sSpent").textContent = money(spent);
  document.getElementById("sLeft").textContent = money(left);
  const sd = document.getElementById("sDiff");
  sd.textContent = (sched>=0?"+":"−") + money(Math.abs(sched)).replace("£","£");
  sd.style.color = sched>=0 ? "var(--good)" : "var(--bad)";
  const sp = document.getElementById("sProj");
  sp.textContent = money(proj);
  sp.style.color = proj>=TARGET ? "var(--good)" : "var(--bad)";

  const today = todayISO();
  document.getElementById("ledger").innerHTML = rows.map(r=>{
    const on = r.spend!==null;
    const cls = ["day", on?"":"future", r.day===today?"today":""].join(" ");
    const sc = on ? (r.diff>=0?"ok":"no") : "na";
    return `<div class="${cls}"><span class="d">${lbl(r.day)}</span>
      <span class="a mono">${money(r.allow)}</span>
      <span class="s mono ${sc}">${on?money(r.spend):"—"}</span></div>`;
  }).join("");
}

function say(msg, err){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status" + (err?" err":"");
}

async function boot(){
  try{ await load(); render();
    say(remote ? `Synced · ${Object.keys(log).length} days` : `On this device · ${Object.keys(log).length} days`);
  }catch(e){ say("Could not load: "+e.message, true); render(); }
}

document.getElementById("log").onclick = async () => {
  const el = document.getElementById("amt");
  const v = parseFloat(el.value.replace(",","."));
  if(isNaN(v) || v<0) return say("Enter a number", true);
  const day = targetDay();
  const prev = {...log};
  log[day] = v; render(); say("Saving…");
  try{ await persist(day, v); el.value=""; say(remote?"Synced ✓":"Saved ✓"); }
  catch(e){ log = prev; render(); say("Not saved: "+e.message, true); }
};

document.getElementById("undo").onclick = async () => {
  const done = DAYS.filter(d=>log[d]!==undefined);
  if(!done.length) return;
  const day = done[done.length-1];
  const prev = {...log};
  delete log[day]; render(); say("Removing…");
  try{ await remove(day); say("Removed "+lbl(day)); }
  catch(e){ log = prev; render(); say("Not removed: "+e.message, true); }
};

document.getElementById("exp").onclick = () => {
  const d = document.getElementById("dlg");
  d.innerHTML = `<p style="margin-top:0;font-size:13px">Copy and keep this somewhere safe:</p>
    <textarea readonly style="width:100%;height:140px;background:#1E252C;color:#EEF1F3;
      border:1px solid #3A4854;border-radius:8px;padding:8px;font-family:ui-monospace,monospace;
      font-size:12px">${JSON.stringify(log)}</textarea>
    <button class="ghost" onclick="document.getElementById('dlg').close()">Close</button>`;
  d.showModal();
};

document.getElementById("amt").addEventListener("keydown", e => {
  if(e.key==="Enter") document.getElementById("log").click();
});

boot();
</script>
