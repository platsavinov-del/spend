<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spend">
<style>
  :root{
    --paper:#EAE7DF; --paper-2:#E0DCD2; --ink:#1A1C1F; --ink-2:#4A4741;
    --fade:#A9A69B; --rule:#C3BFB4; --good:#2F6B4F; --bad:#A8422A; --brass:#8A6A1F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    padding:max(16px,env(safe-area-inset-top)) 12px 40px;-webkit-font-smoothing:antialiased}
  .slip{max-width:420px;margin:0 auto;background:var(--paper);padding:22px 18px 8px;
    position:relative;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .slip::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:var(--paper);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px);
    mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px)}
  .print{animation:print .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes print{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .head{text-align:center;letter-spacing:.28em;font-size:11px;color:var(--ink-2)}
  .sub{text-align:center;font-size:11px;color:var(--fade);margin-top:4px;letter-spacing:.08em}
  .rule{border:0;border-top:1px dashed var(--rule);margin:14px 0}
  .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink-2)}
  .big{font-size:46px;letter-spacing:-.04em;line-height:1;margin-top:2px;
    font-variant-numeric:tabular-nums;transition:opacity .18s}
  .big.flick{animation:flick .45s steps(3,end)}
  @keyframes flick{0%,100%{opacity:1}30%{opacity:.35}60%{opacity:.8}}
  .tag{font-size:10px;letter-spacing:.12em;border:1px solid var(--ink);padding:2px 6px;
    margin-left:8px;vertical-align:middle}
  .row-in{display:flex;gap:0;margin:12px 0 4px;border:1px solid var(--ink)}
  input{flex:1;min-width:0;background:transparent;border:0;padding:12px 10px;
    color:var(--ink);font-size:17px;outline:none;font-family:inherit;
    font-variant-numeric:tabular-nums}
  input::placeholder{color:var(--fade)}
  button{background:var(--ink);color:var(--paper);border:0;padding:0 18px;font-size:12px;
    letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:transform .12s}
  button:active{transform:scale(.97)}
  .ghost{width:100%;background:transparent;color:var(--ink-2);border:1px dashed var(--rule);
    padding:9px;letter-spacing:.12em;margin-top:8px}
  .status{font-size:11px;color:var(--ink-2);min-height:15px;margin-top:8px;letter-spacing:.06em}
  .status.err{color:var(--bad)}
  .tot{display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;padding:4px 0;gap:8px}
  .tot .k{color:var(--ink-2);letter-spacing:.1em;white-space:nowrap}
  .tot .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
  .tot .v{font-variant-numeric:tabular-nums}
  .day{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;
    cursor:pointer;position:relative;transition:background .15s}
  .day:hover{background:var(--paper-2)}
  .day .d{width:52px;color:var(--ink-2)}
  .day .a{flex:1;text-align:right;color:var(--fade);font-variant-numeric:tabular-nums}
  .day .s{width:74px;text-align:right;font-variant-numeric:tabular-nums}
  .day.future{color:var(--fade)}
  .day.sel{background:var(--ink);color:var(--paper)}
  .day.sel .d,.day.sel .a{color:var(--paper-2)}
  .day.miss .s{color:var(--bad)}
  .day.ok .s{color:var(--good)}
  .day.over .s{color:var(--bad)}
  .day.today::before{content:"\u25B8";position:absolute;left:-8px;color:var(--ink)}
  .barcode{height:34px;margin:16px 0 6px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,
      var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
  .foot{text-align:center;font-size:10px;letter-spacing:.22em;color:var(--fade);
    padding-bottom:10px}
  dialog{background:var(--paper);color:var(--ink);border:1px solid var(--ink);
    max-width:400px;padding:16px;font-family:inherit}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  @media (prefers-reduced-motion:reduce){
    .print,.big.flick{animation:none}
    *{transition:none!important}
  }
</style>

<div class="slip">
  <div class="head print">SPEND CHALLENGE</div>
  <div class="sub print">12 AUG \u2014 11 SEP \u00b7 GLASGOW</div>
  <hr class="rule print">

  <div class="print" style="animation-delay:.05s">
    <div class="lbl" id="heroLbl">ALLOWANCE</div>
    <div class="big" id="heroNum">\u2014</div>
  </div>

  <div class="row-in print" style="animation-delay:.1s">
    <input id="amt" inputmode="decimal" placeholder="0.00">
    <button id="logBtn">LOG</button>
  </div>
  <div class="status" id="status">\u2026</div>
  <button class="ghost" id="clearBtn" style="display:none">CLEAR THIS DAY</button>

  <hr class="rule">
  <div id="totals"></div>

  <hr class="rule">
  <div class="lbl" style="margin-bottom:6px">DETAIL \u00b7 TAP A DAY TO EDIT</div>
  <div id="ledger"></div>

  <hr class="rule">
  <button class="ghost" id="todayBtn">GO TO NEXT UNLOGGED DAY</button>
  <button class="ghost" id="exp">EXPORT BACKUP</button>
  <div class="barcode"></div>
  <div class="foot">THANK YOU \u00b7 KEEP THIS RECEIPT</div>
</div>

<dialog id="dlg"></dialog>

<script>
const SUPABASE_URL = "https://helajsuxtjzxfcbwjdqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_TD2HOG6IkwkuYaaLfs6dhg_LaZZCmek";

const TOTAL = 442, TARGET = 300;
const LONDON = {"2026-08-14":20,"2026-08-15":45,"2026-08-16":45};
const DAYS = (()=>{const o=[],d=new Date("2026-08-12T12:00:00Z"),e=new Date("2026-09-11T12:00:00Z");
  while(d<=e){o.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);}return o;})();
const money = n => "\u00a3" + n.toFixed(2);
const lbl = s => new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"UTC"}).toUpperCase();
const todayISO = () => { const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

const remote = !!(SUPABASE_URL && SUPABASE_KEY);
let log = {}, target = null, pinned = false, firstPaint = true, shownNum = null;

const sb = (path, opts={}) => fetch(SUPABASE_URL+"/rest/v1/"+path, {
  ...opts, headers:{apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json", Prefer:"resolution=merge-duplicates", ...(opts.headers||{})}});

async function load(){
  if(remote){
    const r = await sb("spend_days?select=day,amount");
    if(!r.ok) throw new Error("HTTP "+r.status);
    log = Object.fromEntries((await r.json()).map(x=>[x.day, Number(x.amount)]));
  } else log = JSON.parse(localStorage.getItem("spend-challenge") || "{}");
}
async function persist(day, amount){
  if(remote){
    const r = await sb("spend_days", {method:"POST", body:JSON.stringify({day, amount})});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else localStorage.setItem("spend-challenge", JSON.stringify(log));
}
async function remove(day){
  if(remote){
    const r = await sb("spend_days?day=eq."+day, {method:"DELETE"});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else localStorage.setItem("spend-challenge", JSON.stringify(log));
}

function engine(){
  let spent=0, skim=0; const rows=[];
  for(const day of DAYS){
    const left = TOTAL - spent - skim;
    const ahead = DAYS.filter(d => d>=day && log[d]===undefined);
    const lond = ahead.reduce((a,d)=>a+(LONDON[d]||0),0);
    const norm = ahead.filter(d=>!LONDON[d]).length;
    const allow = LONDON[day] ?? (norm>0 ? Math.max((left-lond)/norm,0) : 0);
    const v = log[day];
    if(v===undefined){ rows.push({day,allow,spend:null}); continue; }
    const diff = allow - v;
    if(diff>0) skim += diff*0.3;
    spent += v;
    rows.push({day,allow,spend:v,diff});
  }
  return {rows, spent, skim, left: TOTAL-spent-skim, proj: TARGET+skim};
}

function streak(){
  const done = DAYS.filter(d=>log[d]!==undefined);
  if(!done.length) return {n:0, broken:false};
  const last = done[done.length-1];
  let n=0, i=DAYS.indexOf(last);
  while(i>=0 && log[DAYS[i]]!==undefined){ n++; i--; }
  const t = todayISO();
  return {n, broken: DAYS.some(d => d < t && d < last && log[d]===undefined)};
}

function nextUnlogged(){ return DAYS.find(d=>log[d]===undefined) || DAYS[DAYS.length-1]; }

// count up to the new figure instead of swapping it
function rollTo(el, to){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const from = shownNum;
  shownNum = to;
  if(reduce || from===null || Math.abs(to-from) < 0.02){ el.firstChild.nodeValue = money(to); return; }
  el.classList.add("flick");
  setTimeout(()=>el.classList.remove("flick"), 460);
  const t0 = performance.now(), dur = 420;
  (function step(now){
    const p = Math.min((now-t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);
    el.firstChild.nodeValue = money(from + (to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}

function render(){
  const {rows,spent,left,proj} = engine();
  if(!pinned) target = nextUnlogged();
  const row = rows.find(r=>r.day===target);
  const editing = log[target]!==undefined;

  document.getElementById("heroLbl").textContent =
    (editing ? "EDITING \u00b7 " : "ALLOWANCE \u00b7 ") + lbl(target);

  const hero = document.getElementById("heroNum");
  if(!hero.firstChild || hero.firstChild.nodeType!==3) hero.textContent = money(row.allow);
  rollTo(hero, row.allow);
  let tag = hero.querySelector(".tag");
  if(LONDON[target]){
    if(!tag){ tag=document.createElement("span"); tag.className="tag"; hero.appendChild(tag); }
    tag.textContent = "LDN";
  } else if(tag) tag.remove();

  const done = rows.filter(r=>r.spend!==null);
  const sched = done.reduce((a,r)=>a+r.diff,0);
  const st = streak();

  const totals = [
    ["DAYS LOGGED", done.length + " / " + DAYS.length, ""],
    ["STREAK", st.n === 0 ? "\u2014" : st.n, st.broken ? "bad" : "brass"],
    ["SPENT", money(spent), ""],
    ["BUDGET LEFT", money(left), ""],
    ["VS SCHEDULE", (sched>=0?"+":"\u2212")+money(Math.abs(sched)), sched>=0?"good":"bad"],
    ["PROJECTED SAVED", money(proj), proj>=TARGET?"good":"bad"]
  ];
  document.getElementById("totals").innerHTML = totals.map(([k,v,c])=>
    `<div class="tot"><span class="k">${k}</span><span class="dots"></span>
     <span class="v" style="${c==="good"?"color:var(--good)":c==="bad"?"color:var(--bad)":c==="brass"?"color:var(--brass)":""}">${v}</span></div>`
  ).join("");

  document.getElementById("logBtn").textContent = editing ? "UPDATE" : "LOG";
  document.getElementById("clearBtn").style.display = editing ? "block" : "none";

  const t = todayISO();
  document.getElementById("ledger").innerHTML = rows.map((r,i)=>{
    const on = r.spend!==null;
    const cls = ["day", on?(r.diff>=0?"ok":"over"):"future", r.day===t?"today":"",
                 r.day===target?"sel":"", (!on && r.day<t)?"miss":""].join(" ");
    const delay = firstPaint ? `animation-delay:${Math.min(i*18,420)}ms` : "";
    const val = on ? money(r.spend) : (r.day<t ? "MISSED" : "\u2014");
    return `<div class="${cls} ${firstPaint?"print":""}" style="${delay}" data-day="${r.day}">
      <span class="d">${lbl(r.day)}</span>
      <span class="a">${money(r.allow)}</span>
      <span class="s">${val}</span></div>`;
  }).join("");
  firstPaint = false;

  [...document.querySelectorAll(".day")].forEach(el=>{
    el.onclick = () => {
      pinned = true; target = el.dataset.day;
      const cur = log[target];
      document.getElementById("amt").value = cur!==undefined ? cur : "";
      render();
      document.getElementById("amt").focus();
    };
  });
}

function say(msg, err){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status" + (err?" err":"");
}

async function boot(){
  try{ await load(); render();
    say((remote ? "SYNCED" : "THIS DEVICE") + " \u00b7 " + Object.keys(log).length + " DAYS ON FILE");
  }catch(e){ say("COULD NOT LOAD \u00b7 "+e.message, true); render(); }
}

document.getElementById("logBtn").onclick = async () => {
  const el = document.getElementById("amt");
  const v = parseFloat(el.value.replace(",","."));
  if(isNaN(v) || v<0) return say("ENTER A NUMBER", true);
  const day = target, prev = {...log};
  log[day] = v; render(); say("SAVING\u2026");
  try{
    await persist(day, v);
    el.value=""; pinned=false; render();
    say((remote?"SYNCED":"SAVED")+" \u00b7 "+lbl(day));
  }catch(e){ log = prev; render(); say("NOT SAVED \u00b7 "+e.message, true); }
};

document.getElementById("clearBtn").onclick = async () => {
  const day = target;
  if(log[day]===undefined) return;
  const prev = {...log};
  delete log[day]; render(); say("CLEARING\u2026");
  try{ await remove(day); document.getElementById("amt").value=""; pinned=false; render();
    say("CLEARED \u00b7 "+lbl(day)); }
  catch(e){ log = prev; render(); say("NOT CLEARED \u00b7 "+e.message, true); }
};

document.getElementById("todayBtn").onclick = () => {
  pinned = false; document.getElementById("amt").value = ""; render();
  say("BACK TO NEXT UNLOGGED DAY");
};

document.getElementById("exp").onclick = () => {
  const d = document.getElementById("dlg");
  d.innerHTML = `<div style="font-size:11px;letter-spacing:.16em;margin-bottom:8px">BACKUP</div>
    <textarea readonly style="width:100%;height:130px;background:#E0DCD2;color:#1A1C1F;
      border:1px solid #1A1C1F;padding:8px;font-family:inherit;font-size:11px">${JSON.stringify(log)}</textarea>
    <button class="ghost" onclick="document.getElementById('dlg').close()">CLOSE</button>`;
  d.showModal();
};

document.getElementById("amt").addEventListener("keydown", e => {
  if(e.key==="Enter") document.getElementById("logBtn").click();
});

boot();

</script>
