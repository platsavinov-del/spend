<meta name="apple-mobile-web-app-title" content="Spend">
<style>
  :root{
    --paper:#EAE7DF; --paper-2:#E0DCD2; --ink:#1A1C1F; --ink-2:#4A4741;
    --fade:#A9A69B; --rule:#C3BFB4; --good:#2F6B4F; --bad:#A8422A; --brass:#8A6A1F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    padding:max(16px,env(safe-area-inset-top)) 12px 40px;-webkit-font-smoothing:antialiased}
  .slip{max-width:420px;margin:0 auto;background:var(--paper);padding:22px 18px 8px;
    position:relative;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .slip::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:var(--paper);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px);
    mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px)}
  .print{animation:print .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes print{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .head{text-align:center;letter-spacing:.28em;font-size:11px;color:var(--ink-2)}
  .sub{text-align:center;font-size:11px;color:var(--fade);margin-top:4px;letter-spacing:.08em}
  .rule{border:0;border-top:1px dashed var(--rule);margin:14px 0}
  .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink-2)}
  .big{font-size:46px;letter-spacing:-.04em;line-height:1;margin-top:2px;
    font-variant-numeric:tabular-nums;transition:opacity .18s}
  .big.flick{animation:flick .45s steps(3,end)}
  @keyframes flick{0%,100%{opacity:1}30%{opacity:.35}60%{opacity:.8}}
  .tag{font-size:10px;letter-spacing:.12em;border:1px solid var(--ink);padding:2px 6px;
    margin-left:8px;vertical-align:middle}
  .row-in{display:flex;gap:0;margin:12px 0 4px;border:1px solid var(--ink)}
  input{flex:1;min-width:0;background:transparent;border:0;padding:12px 10px;
    color:var(--ink);font-size:17px;outline:none;font-family:inherit;
    font-variant-numeric:tabular-nums}
  input::placeholder{color:var(--fade)}
  button{background:var(--ink);color:var(--paper);border:0;padding:0 18px;font-size:12px;
    letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:transform .12s}
  button:active{transform:scale(.97)}
  .ghost{width:100%;background:transparent;color:var(--ink-2);border:1px dashed var(--rule);
    padding:9px;letter-spacing:.12em;margin-top:8px}
  .status{font-size:11px;color:var(--ink-2);min-height:15px;margin-top:8px;letter-spacing:.06em}
  .status.err{color:var(--bad)}
  .tot{display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;padding:4px 0;gap:8px}
  .tot .k{color:var(--ink-2);letter-spacing:.1em;white-space:nowrap}
  .tot .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
  .tot .v{font-variant-numeric:tabular-nums}
  .day{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;
    cursor:pointer;position:relative;transition:background .15s}
  .day:hover{background:var(--paper-2)}
  .day .d{width:76px;color:var(--ink-2)}
  .day.we .d{color:var(--ink);font-weight:700}
  .day.sel.we .d{color:var(--paper)}
  .day .a{flex:1;text-align:right;color:var(--fade);font-variant-numeric:tabular-nums}
  .day .s{width:74px;text-align:right;font-variant-numeric:tabular-nums}
  .day.future{color:var(--fade)}
  .day.sel{background:var(--ink);color:var(--paper)}
  .day.sel .d,.day.sel .a{color:var(--paper-2)}
  .day.miss .s{color:var(--bad)}
  .day.ok .s{color:var(--good)}
  .day.over .s{color:var(--bad)}
  .day.today .d::before{content:"▸ ";color:var(--ink)}
  .barcode{height:34px;margin:16px 0 6px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,
      var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
  .foot{text-align:center;font-size:10px;letter-spacing:.22em;color:var(--fade);
    padding-bottom:10px}
  dialog{background:var(--paper);color:var(--ink);border:1px solid var(--ink);
    max-width:400px;padding:16px;font-family:inherit}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  @media (prefers-reduced-motion:reduce){
    .print,.big.flick{animation:none}
    *{transition:none!important}
  }
  .tot.total{font-size:14px;padding-top:8px}
  .tot.total .k{color:var(--ink)}
  .tot.total .v{font-weight:700}
  .day .mk{color:var(--brass)}
  .owed-toggle{width:100%;background:transparent;color:var(--ink-2);
    border:1px dashed var(--rule);padding:7px;letter-spacing:.1em;font-size:10px;
    margin-top:6px;text-align:center}
  .owed-fields{display:none;gap:6px;margin-top:6px}
  .owed-fields.on{display:flex}
  .owed-fields .fld{flex:1;border:1px solid var(--rule);display:flex}
  .owed-fields input{font-size:14px;padding:8px}

<script>
const SUPABASE_URL = "https://helajsuxtjzxfcbwjdqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_TD2HOG6IkwkuYaaLfs6dhg_LaZZCmek";
const SKIM = 0.3;                       // share of an underspent day that is banked
const CUR  = ["GBP","EUR","USD"];
const SYM  = {GBP:"£", EUR:"€", USD:"$"};

// ------------------------------------------------------------------ helpers
const money = (n, c="GBP") => (n<0 ? "−" : "") + SYM[c] + Math.abs(n).toFixed(2);
const lbl   = s => new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"UTC"}).toUpperCase();
const WD    = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const dow   = s => new Date(s+"T12:00:00Z").getUTCDay();
const isWE  = s => dow(s)===0 || dow(s)===6;
const lblWk = s => WD[dow(s)] + " " + s.slice(8,10);
const todayISO = () => { const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v||"").replace(",",".")); return isNaN(n)?null:n; };
const dayRange = (a,b)=>{const o=[],d=new Date(a+"T12:00:00Z"),e=new Date(b+"T12:00:00Z");
  while(d<=e){o.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);}return o;};

// ------------------------------------------------------------------ session
const SKEY = "spend-session";
let session = null;
try{ session = JSON.parse(localStorage.getItem(SKEY) || "null"); }catch(e){ session = null; }
const saveSession = s => { session = s;
  try{ s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); }catch(e){} };

async function tokenCall(body){
  const grant = body.refresh_token ? "refresh_token" : "password";
  const r = await fetch(SUPABASE_URL+"/auth/v1/token?grant_type="+grant, {
    method:"POST", headers:{apikey:SUPABASE_KEY, "Content-Type":"application/json"},
    body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.error || ("HTTP "+r.status));
  j.expires_at = Math.floor(Date.now()/1000) + (j.expires_in || 3600);
  return j;
}
async function ensureFresh(){
  if(!session) throw new Error("NOT SIGNED IN");
  if(session.expires_at - 60 > Math.floor(Date.now()/1000)) return;
  saveSession(await tokenCall({refresh_token: session.refresh_token}));
}
async function api(path, opts={}){
  await ensureFresh();
  const r = await fetch(SUPABASE_URL+"/rest/v1/"+path, {...opts,
    headers:{apikey:SUPABASE_KEY, Authorization:"Bearer "+session.access_token,
      "Content-Type":"application/json", ...(opts.headers||{})}});
  if(r.status === 401){ saveSession(null); showGate("SESSION EXPIRED · SIGN IN AGAIN"); throw new Error("401"); }
  if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
  return r.status === 204 ? null : r.json();
}

// ------------------------------------------------------------------ state
let P=null, tx=[], inbox=[], accounts=[], debts=[], subs=[], conf={};
let fx = {GBP:1}, fxDate = null;
let DAYS=[], target=null, pinned=false, firstPaint=true, shownNum=null;
let draft=[], pocket="daily", curIdx=0;
let page="spend", newDir="they_owe_me", newCurIdx=0;
let inboxCur = {};   // id -> currency the import guessed wrong

const toGBP = (a, c) => a / (fx[c] || 1);
const potCap = k => k==="wardrobe" ? Number(P.wardrobe) : Number(P.pleasure);
const dailyOf = d => tx.filter(t => t.pocket==="daily" && t.day===d);
const owedIn  = t => (Array.isArray(t.debts)?t.debts:[]).reduce((s,x)=>s+(Number(x.a)||0),0);
const openOwed= t => (Array.isArray(t.debts)?t.debts:[]).filter(x=>!x.s).reduce((s,x)=>s+(Number(x.a)||0),0);
const netOfTx = t => Math.max(Number(t.amount) - owedIn(t), 0);
const logged  = d => dailyOf(d).length > 0;
const netOf   = d => logged(d) ? dailyOf(d).reduce((s,t)=>s+netOfTx(t),0) : undefined;
const potTx   = k => tx.filter(t => t.pocket===k);
const potSpent= k => potTx(k).reduce((s,t)=>s+Number(t.amount),0);
const potLeft = k => potCap(k) - potSpent(k);

// ------------------------------------------------------------------ loading
async function loadFx(){
  const rows = await api("spend_fx?select=quote,per_gbp,as_of&order=as_of.desc&limit=12");
  if(rows.length){ fxDate = rows[0].as_of;
    rows.filter(r=>r.as_of===fxDate).forEach(r => fx[r.quote] = Number(r.per_gbp)); }
  try{                                    // live ECB rates, cached for next time
    const r = await fetch("https://api.frankfurter.dev/v1/latest?base=GBP&symbols=EUR,USD");
    if(!r.ok) return;
    const j = await r.json();
    if(j.date === fxDate) return;
    fx = {GBP:1, ...j.rates}; fxDate = j.date;
    await api("spend_fx?on_conflict=quote,as_of", {method:"POST",
      headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify(CUR.map(q => ({quote:q, as_of:j.date, per_gbp: q==="GBP"?1:j.rates[q]})))});
  }catch(e){ /* offline or blocked - cached rates stand */ }
}

async function load(){
  await loadFx();
  const t = todayISO();
  const ps = await api("spend_periods?select=*&order=starts.desc");
  if(!ps.length) throw new Error("NO PERIOD CONFIGURED");
  P = ps.find(p => p.starts <= t && t <= p.ends) || ps[0];
  DAYS = dayRange(P.starts, P.ends);
  [tx, inbox, accounts, debts, subs] = await Promise.all([
    api("spend_tx?select=*&day=gte."+P.starts+"&day=lte."+P.ends+"&order=day.desc,created_at.desc"),
    api("spend_inbox?select=*&status=eq.new&order=occurred_at.desc"),
    api("spend_accounts?select=*&order=sort"),
    api("spend_debts?select=*&settled=is.false&order=amount.desc"),
    api("spend_subs?select=*&active=is.true")
  ]);
  try{ const c = await api("spend_config?select=key,value");
       conf = Object.fromEntries(c.map(r=>[r.key, r.value])); }catch(e){ conf = {}; }
}

// ------------------------------------------------------------------ engine
function engine(){
  let spent=0, skim=0; const rows=[];
  const fixed = P.fixed_day || {};
  for(const day of DAYS){
    const left = Number(P.daily) - spent - skim;
    const ahead = DAYS.filter(d => d>=day);          // as of this day, incl. itself
    const fx_ = ahead.reduce((a,d)=>a+(Number(fixed[d])||0),0);
    const norm = ahead.filter(d=>!fixed[d]).length;
    const allow = fixed[day] != null ? Number(fixed[day])
                : (norm>0 ? Math.max((left-fx_)/norm, 0) : 0);
    const net = netOf(day);
    if(net===undefined){ rows.push({day, allow, net:null}); continue; }
    const diff = allow - net;
    if(diff>0) skim += diff*SKIM;
    spent += net;
    rows.push({day, allow, net, diff, items:dailyOf(day)});
  }
  return {rows, spent, skim, left: Number(P.daily) - spent - skim};
}

// ------------------------------------------------------------------ money views
function balanceView(){
  const g = a => toGBP(Number(a.balance), a.currency);
  const sum = f => accounts.filter(f).reduce((s,a)=>s+g(a), 0);
  const owedMe = debts.filter(d=>d.direction==="they_owe_me")
                      .reduce((s,d)=>s+toGBP(Number(d.amount), d.currency), 0);
  const iOwe   = debts.filter(d=>d.direction==="i_owe")
                      .reduce((s,d)=>s+toGBP(Number(d.amount), d.currency), 0);
  const inTx   = tx.reduce((s,t)=>s+openOwed(t), 0);     // unsettled splits this period
  return {
    spendable: sum(a=>a.spendable),
    cushion:   sum(a=>a.kind==="savings" && a.circuit==="salary"),
    loan:      sum(a=>a.circuit==="loan"),
    reserve:   sum(a=>a.kind==="cash"),
    accounts:  sum(()=>true),
    owedMe: owedMe + inTx, iOwe,
    net: sum(()=>true) + owedMe + inTx - iOwe
  };
}

// ------------------------------------------------------------------ chrome
function line(k, v, c, big){
  const col = c==="good"?"color:var(--good)":c==="bad"?"color:var(--bad)":c==="brass"?"color:var(--brass)":"";
  return `<div class="tot${big?" total":""}"><span class="k">${k}</span>
    <span class="dots"></span><span class="v" style="${col}">${v}</span></div>`;
}
function rollTo(el, to){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const from = shownNum; shownNum = to;
  if(reduce || from===null || Math.abs(to-from) < 0.02){ el.firstChild.nodeValue = money(to); return; }
  el.classList.add("flick"); setTimeout(()=>el.classList.remove("flick"), 460);
  const t0 = performance.now();
  (function step(now){
    const p = Math.min((now-t0)/420, 1), e = 1 - Math.pow(1-p, 3);
    el.firstChild.nodeValue = money(from + (to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}
function say(msg, err){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status" + (err?" err":"");
}
const $ = id => document.getElementById(id);

// ------------------------------------------------------------------ draft owed
function renderDraft(){
  const box = $("owedFields");
  box.innerHTML = draft.map((e,i)=>`
    <div class="owed-row">
      <label class="fld"><input class="dAmt" data-i="${i}" inputmode="decimal"
        placeholder="0.00" value="${e.a || ""}"></label>
      <label class="fld"><input class="dWho" data-i="${i}" maxlength="14"
        placeholder="who" value="${esc(e.w)}"></label>
      <button class="drop" data-drop="${i}">×</button>

function render(){
  const E = engine();
  const t = todayISO();
  if(!pinned) target = DAYS.includes(t) ? t : DAYS[DAYS.length-1];
  const row = E.rows.find(r=>r.day===target) || E.rows[0];
  const potMode = pocket!=="daily";

  const B = balanceView();
  $("periodLbl").textContent = P.label + " · GLASGOW";
  const heroFor = {
    spend:   [potMode ? pocket.toUpperCase() + " LEFT"
                      : "ALLOWANCE · " + lbl(target) + (target!==t ? " · PINNED" : ""),
              potMode ? potLeft(pocket) : row.allow],
    balance: ["NET WORTH", B.net],
    savings: ["SAVED · TOTAL", B.cushion + B.loan],
    debts:   ["NET OWED TO YOU", B.owedMe - B.iOwe]
  }[page];
  $("heroLbl").textContent = heroFor[0];
  const hero = $("heroNum");
  const val = heroFor[1];
  if(!hero.firstChild || hero.firstChild.nodeType!==3) hero.textContent = money(val);
  rollTo(hero, val);
  hero.style.color = val < 0 ? "var(--bad)" : "";

  $("logBtn").textContent = potMode ? "ADD" : "LOG";
  $("debtCount").textContent = "";
  $("owedToggle").style.display = potMode ? "none" : "block";
  $("owedFields").style.display = potMode ? "none" : "";
  $("zeroBtn").style.display = (!potMode && !logged(target)) ? "block" : "none";
  $("ledgerWrap").style.display = potMode ? "none" : "block";
  $("todayBtn").style.display = (pinned && !potMode) ? "block" : "none";
  $("curBtn").textContent = SYM[CUR[curIdx]];

  if(page === "spend"){ renderUnfiled(); renderTxList(); renderPots(); }
  if(page === "balance"){ renderBalance(); renderByCurrency(); }
  if(page === "savings"){ renderSavings(); }
  if(page === "debts"){ renderDebts(); }

  const done = E.rows.filter(r=>r.net!==null);
  const sched = done.reduce((a,r)=>a+r.diff, 0);
  const subsLeft = subs.filter(s=>!s.last_paid)
    .reduce((s,x)=>s+toGBP(Number(x.amount), x.currency), 0);
  let html = [
    ["DAYS LOGGED", done.length + " / " + DAYS.length, ""],
    ["DAILY SPENT", money(E.spent), ""],
    ["DAILY LEFT", money(E.left), E.left<0?"bad":""],
    ["SAVED SO FAR", money(E.skim), "good"],
    ["VS SCHEDULE", (sched>=0?"+":"−")+money(Math.abs(sched)), sched>=0?"good":"bad"]
  ].map(([k,v,c])=>line(k,v,c)).join("");
  if(subsLeft > 0) html += line("SUBS DUE", money(subsLeft), "");
  html += '<hr class="rule" style="margin:8px 0">';
  html += line("SAVINGS TARGET", money(Number(P.savings_target)), "", true);
  html += line("+ SKIMMED 30%", money(E.skim), "good");
  html += line("PROJECTED", money(Number(P.savings_target) + E.skim), "good");
  $("totals").innerHTML = html;

  $("ledger").innerHTML = E.rows.map((r,i)=>{
    const on = r.net!==null;
    const cls = ["day", on?(r.diff>=0?"ok":"over"):"future", r.day===t?"today":"",
                 r.day===target?"sel":"", (!on && r.day<t)?"miss":"", isWE(r.day)?"we":""].join(" ");
    const delay = firstPaint ? `animation-delay:${Math.min(i*18,420)}ms` : "";
    const mark = on && r.items.some(x=>owedIn(x)>0) ? `<span class="mk">◦</span>` : "";
    const val = on ? money(r.net)+mark : (r.day<t ? "MISSED" : "—");
    return `<div class="${cls} ${firstPaint?"print":""}" style="${delay}" data-day="${r.day}">
      <span class="d">${lblWk(r.day)}</span>
      <span class="a">${money(r.allow)}</span>
      <span class="s">${val}</span></div>`;
  }).join("");
  firstPaint = false;
  [...document.querySelectorAll(".day")].forEach(el=>{
    el.onclick = () => { pinned = true; target = el.dataset.day;
      if(pocket!=="daily") setPocket("daily"); else render(); };
  });
  updateNote();
}

async function addTx(rec, msg){
  const made = await api("spend_tx", {method:"POST", headers:{Prefer:"return=representation"},
    body:JSON.stringify(rec)});
  tx.unshift(made[0]);
  render(); say(msg);
  return made[0];
}

$("logBtn").onclick = async () => {
  const a = num($("amt").value);
  if(a===null || a<0) return say("ENTER A NUMBER", true);
  if(a===0) return say("ZERO — USE THE ZERO DAY BUTTON", true);
  const cur = CUR[curIdx], gbp = Math.round(toGBP(a, cur)*100)/100;
  const note = ($("note").value||"").trim();
  const d = draft.filter(e=>(Number(e.a)||0)>0)
    .map(e=>({a:Math.round(toGBP(Number(e.a), cur)*100)/100, w:(e.w||"").trim(), s:false}));
  const owed = d.reduce((s,x)=>s+x.a, 0);
  if(owed > gbp) return say("OWED IS MORE THAN THE TOTAL", true);
  say("SAVING…");
  try{
    await addTx({day: pocket==="daily" ? target : todayISO(), pocket, amount: gbp,
      note: note || null, debts: d, source:"manual",
      orig_amount: a, orig_currency: cur, fx_rate: fx[cur]},
      (pocket==="daily" ? "LOGGED" : pocket.toUpperCase()) + " · " + money(gbp)
      + (cur!=="GBP" ? " ("+money(a,cur)+")" : "")
      + (d.length ? " · " + money(owed) + " OWED BY " + d.length : ""));
    $("amt").value=""; $("note").value=""; draft=[]; setOwedOpen(false);
  }catch(e){ render(); say("NOT SAVED · "+e.message, true); }
};

$("zeroBtn").onclick = async () => {
  say("SAVING…");
  try{ await addTx({day:target, pocket:"daily", amount:0, note:null, debts:[],
         source:"manual", orig_amount:0, orig_currency:"GBP", fx_rate:1},
         "ZERO DAY · " + lbl(target)); }
  catch(e){ render(); say("NOT SAVED · "+e.message, true); }
};

async function killTx(id){
  const i = tx.findIndex(t=>t.id===id); if(i<0) return;
  const gone = tx[i]; tx.splice(i,1); render(); say("REMOVING…");
  try{ await api("spend_tx?id=eq."+id, {method:"DELETE"});
    say("REMOVED · " + money(Number(gone.amount))); }
  catch(e){ tx.splice(i,0,gone); render(); say("NOT REMOVED · "+e.message, true); }
}

async function fileInbox(id, where, note){
  const i = inbox.findIndex(x=>x.id===id); if(i<0) return;
  const item = inbox[i];
  inbox.splice(i,1); render(); say(where==="ignored" ? "IGNORING…" : "FILING…");
  try{
    let txId = null;
    if(where !== "ignored"){
      const cur = inboxCur[item.id] || item.currency;
      const gbp = Math.round(toGBP(Number(item.amount), cur)*100)/100;
      const made = await addTx({
        day: item.occurred_at.slice(0,10), pocket: where, amount: gbp,
        note: (note||item.merchant||"").trim() || null, debts: [], source:"wallet",
        inbox_id: item.id, orig_amount: Number(item.amount),
        orig_currency: cur, fx_rate: fx[cur] || 1},
        "FILED · " + where.toUpperCase() + " · " + money(gbp));
      txId = made.id;
    }
    await api("spend_inbox?id=eq."+id, {method:"PATCH",
      body:JSON.stringify({status: where==="ignored" ? "ignored" : "filed", tx_id: txId})});
    if(where==="ignored") say("IGNORED · " + (item.merchant || money(Number(item.amount))));
  }catch(e){ inbox.splice(i,0,item); render(); say("NOT FILED · "+e.message, true); }
}

async function settle(key){
  const [kind, id, idx] = key.split(":");
  say("SETTLING…");
  try{
    if(kind === "row"){
      const i = debts.findIndex(d=>d.id===id); const gone = debts[i];
      debts.splice(i,1); render();
      await api("spend_debts?id=eq."+id, {method:"PATCH",
        body:JSON.stringify({settled:true, settled_at:new Date().toISOString()})});
      say("SETTLED · " + esc(gone.person) + " · " + money(Number(gone.amount), gone.currency));
    } else {
      const t = tx.find(x=>x.id===id); if(!t) return;
      const d = (Array.isArray(t.debts)?t.debts:[]).map((e,i)=> i===+idx ? {...e, s:true} : e);
      t.debts = d; render();
      await api("spend_tx?id=eq."+id, {method:"PATCH", body:JSON.stringify({debts:d})});
      say("SETTLED · " + money(Number(d[+idx].a)) + " BACK");
    }
  }catch(e){ say("NOT SETTLED · "+e.message, true); boot(); }
}

      <textarea readonly rows="${v.length>60?2:1}" onclick="this.select()"

        padding:7px;font-family:inherit;font-size:11px;resize:none">${esc(v)}</textarea></div>`;
  d.innerHTML = `<div style="font-size:11px;letter-spacing:.16em;margin-bottom:10px">SHORTCUT \u00b7 TAP TO COPY</div>
    <div style="font-size:10px;color:#4A4741;letter-spacing:.04em;margin-bottom:10px">
      ONE ACTION: GET CONTENTS OF URL \u00b7 METHOD POST</div>
    ${fld("URL", SUPABASE_URL+"/rest/v1/spend_inbox")}
    ${fld("HEADER apikey", SUPABASE_KEY)}
    ${fld("HEADER x-import-key", key)}
    ${fld("HEADER Content-Type", "application/json")}
    ${fld("HEADER Prefer", "return=minimal")}
    <div style="font-size:10px;color:#4A4741;letter-spacing:.04em;margin:12px 0 6px">
      REQUEST BODY \u00b7 JSON</div>
    <div style="font-size:11px;line-height:1.7">
      <strong>amount</strong> (Number) \u2014 Shortcut Input \u203a Amount<br>
      <strong>currency</strong> (Text) \u2014 EUR or GBP, per card<br>
      <strong>merchant</strong> (Text) \u2014 Shortcut Input \u203a Merchant<br>
      <strong>card</strong> (Text) \u2014 Shortcut Input \u203a Card</div>
    <button class="ghost" onclick="document.getElementById('dlg').close()">CLOSE</button>`;
  d.showModal();
};

$("exp").onclick = () => {
  const d = $("dlg");
  d.innerHTML = `<div style="font-size:11px;letter-spacing:.16em;margin-bottom:8px">BACKUP</div>
    <textarea readonly style="width:100%;height:150px;background:#E0DCD2;color:#1A1C1F;
      border:1px solid #1A1C1F;padding:8px;font-family:inherit;font-size:10px">${esc(
      JSON.stringify({period:P, tx, accounts, debts, subs, fx, fxDate}))}</textarea>
    <button class="ghost" onclick="document.getElementById('dlg').close()">CLOSE</button>`;
  d.showModal();
};

// ------------------------------------------------------------------ gate
function showGate(msg){
  $("app").style.display = "none";
  $("gateWrap").style.display = "block";
  if(msg) $("gStatus").textContent = msg;
}
$("gBtn").onclick = async () => {
  const email = $("gEmail").value.trim(), pass = $("gPass").value;
  if(!email || !pass){ $("gStatus").textContent = "EMAIL AND PASSWORD"; return; }
  $("gStatus").textContent = "CHECKING…"; $("gBtn").disabled = true;
  try{ saveSession(await tokenCall({email, password:pass}));
    $("gPass").value = ""; $("gStatus").textContent = ""; boot(); }
  catch(e){ $("gStatus").textContent = String(e.message).toUpperCase(); }
  finally{ $("gBtn").disabled = false; }
};
$("gPass").addEventListener("keydown", e => { if(e.key==="Enter") $("gBtn").click(); });
$("outBtn").onclick = () => { saveSession(null); location.reload(); };

async function boot(){
  if(!session) return showGate("");
  try{ await ensureFresh(); }
  catch(e){ saveSession(null); return showGate("SIGN IN AGAIN"); }
  $("gateWrap").style.display = "none";
  $("app").style.display = "block";
  try{
    await load(); renderDraft(); render();
    say("SYNCED · " + tx.length + " ITEMS · " + inbox.length + " UNFILED"
      + (fxDate ? " · FX " + fxDate : ""));
  }catch(e){
    if(String(e.message) === "401") return;
    say("COULD NOT LOAD · " + e.message, true);
  }
}
boot();

</script>
