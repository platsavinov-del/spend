<meta name="apple-mobile-web-app-title" content="Spend">
<style>
  :root{
    --paper:#EAE7DF; --paper-2:#E0DCD2; --ink:#1A1C1F; --ink-2:#4A4741;
    --fade:#A9A69B; --rule:#C3BFB4; --good:#2F6B4F; --bad:#A8422A; --brass:#8A6A1F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
    padding:max(16px,env(safe-area-inset-top)) 12px 40px;-webkit-font-smoothing:antialiased}
  .slip{max-width:420px;margin:0 auto;background:var(--paper);padding:22px 18px 8px;
    position:relative;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .slip::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:var(--paper);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px);
    mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px)}
  .print{animation:print .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes print{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .head{text-align:center;letter-spacing:.28em;font-size:11px;color:var(--ink-2)}
  .sub{text-align:center;font-size:11px;color:var(--fade);margin-top:4px;letter-spacing:.08em}
  .rule{border:0;border-top:1px dashed var(--rule);margin:14px 0}
  .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink-2)}
  .big{font-size:46px;letter-spacing:-.04em;line-height:1;margin-top:2px;
    font-variant-numeric:tabular-nums;transition:opacity .18s}
  .big.flick{animation:flick .45s steps(3,end)}
  @keyframes flick{0%,100%{opacity:1}30%{opacity:.35}60%{opacity:.8}}
  .tag{font-size:10px;letter-spacing:.12em;border:1px solid var(--ink);padding:2px 6px;
    margin-left:8px;vertical-align:middle}
  .row-in{display:flex;gap:0;margin:12px 0 4px;border:1px solid var(--ink)}
  input{flex:1;min-width:0;background:transparent;border:0;padding:12px 10px;
    color:var(--ink);font-size:17px;outline:none;font-family:inherit;
    font-variant-numeric:tabular-nums}
  input::placeholder{color:var(--fade)}
  button{background:var(--ink);color:var(--paper);border:0;padding:0 18px;font-size:12px;
    letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:transform .12s}
  button:active{transform:scale(.97)}
  .ghost{width:100%;background:transparent;color:var(--ink-2);border:1px dashed var(--rule);
    padding:9px;letter-spacing:.12em;margin-top:8px}
  .status{font-size:11px;color:var(--ink-2);min-height:15px;margin-top:8px;letter-spacing:.06em}
  .status.err{color:var(--bad)}
  .tot{display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;padding:4px 0;gap:8px}
  .tot .k{color:var(--ink-2);letter-spacing:.1em;white-space:nowrap}
  .tot .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
  .tot .v{font-variant-numeric:tabular-nums}
  .day{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;
    cursor:pointer;position:relative;transition:background .15s}
  .day:hover{background:var(--paper-2)}
  .day .d{width:76px;color:var(--ink-2)}
  .day.we .d{color:var(--ink);font-weight:700}
  .day.sel.we .d{color:var(--paper)}
  .day .a{flex:1;text-align:right;color:var(--fade);font-variant-numeric:tabular-nums}
  .day .s{width:74px;text-align:right;font-variant-numeric:tabular-nums}
  .day.future{color:var(--fade)}
  .day.sel{background:var(--ink);color:var(--paper)}
  .day.sel .d,.day.sel .a{color:var(--paper-2)}
  .day.miss .s{color:var(--bad)}
  .day.ok .s{color:var(--good)}
  .day.over .s{color:var(--bad)}
  .day.today .d::before{content:"▸ ";color:var(--ink)}
  .barcode{height:34px;margin:16px 0 6px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,
      var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
  .foot{text-align:center;font-size:10px;letter-spacing:.22em;color:var(--fade);
    padding-bottom:10px}
  dialog{background:var(--paper);color:var(--ink);border:1px solid var(--ink);
    max-width:400px;padding:16px;font-family:inherit}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  @media (prefers-reduced-motion:reduce){
    .print,.big.flick{animation:none}
    *{transition:none!important}
  }
  .tot.total{font-size:14px;padding-top:8px}
  .tot.total .k{color:var(--ink)}
  .tot.total .v{font-weight:700}
  .day .mk{color:var(--brass)}
  .owed-toggle{width:100%;background:transparent;color:var(--ink-2);
    border:1px dashed var(--rule);padding:7px;letter-spacing:.1em;font-size:10px;
    margin-top:6px;text-align:center}
  .owed-fields{display:none;gap:6px;margin-top:6px}
  .owed-fields.on{display:flex}
  .owed-fields .fld{flex:1;border:1px solid var(--rule);display:flex}
  .owed-fields input{font-size:14px;padding:8px}
  .owed-note{font-size:10px;color:var(--ink-2);margin-top:6px;letter-spacing:.04em}
  .debt{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px;
    border-bottom:1px dotted var(--rule)}
  .debt .dd{width:56px;color:var(--ink-2)}
  .debt .dw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .debt .da{color:var(--brass);font-variant-numeric:tabular-nums}
  .debt button{padding:3px 8px;font-size:9px;letter-spacing:.1em}
  .owed-fields{display:none;flex-direction:column;gap:6px;margin-top:6px}
  .owed-fields.on{display:flex}
  .owed-row{display:flex;gap:6px;align-items:stretch}
  .owed-row .fld{flex:1;border:1px solid var(--rule);display:flex}
  .drop{background:transparent;color:var(--ink-2);border:1px solid var(--rule);
    padding:0 10px;font-size:14px;line-height:1}
  .ghost.mini{margin-top:0;padding:7px;font-size:10px}
</style>
<div class="slip">
  <div class="head print">SPEND CHALLENGE</div>
  <div class="sub print">12 AUG — 11 SEP · GLASGOW</div>
  <hr class="rule print">

  <div class="print" style="animation-delay:.05s">
    <div class="lbl" id="heroLbl">ALLOWANCE</div>
    <div class="big" id="heroNum">—</div>
  </div>

  <div class="row-in print" style="animation-delay:.1s">
    <input id="amt" inputmode="decimal" placeholder="0.00">
    <button id="logBtn">LOG</button>
  </div>

  <button class="owed-toggle" id="owedToggle">+ SOMEONE OWES ME</button>
  <div class="owed-fields" id="owedFields"></div>
  <div class="owed-note" id="owedNote" style="display:none"></div>

  <div class="status" id="status">…</div>
  <button class="ghost" id="clearBtn" style="display:none">CLEAR THIS DAY</button>

  <hr class="rule">
  <div id="totals"></div>

  <div id="debtsWrap" style="display:none">
    <hr class="rule">
    <div class="lbl" style="margin-bottom:6px">OWED TO YOU<span id="debtsCount"></span></div>
    <div id="debts"></div>
  </div>

  <hr class="rule">
  <div class="lbl" style="margin-bottom:6px">DETAIL · TAP A DAY TO EDIT</div>
  <div id="ledger"></div>

  <hr class="rule">
  <button class="ghost" id="todayBtn">GO TO NEXT UNLOGGED DAY</button>
  <button class="ghost" id="exp">EXPORT BACKUP</button>
  <div class="barcode"></div>
  <div class="foot">THANK YOU · KEEP THIS RECEIPT</div>
</div>

<dialog id="dlg"></dialog>
<script>
const SUPABASE_URL = "https://helajsuxtjzxfcbwjdqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_TD2HOG6IkwkuYaaLfs6dhg_LaZZCmek";

const TOTAL = 442, TARGET = 300;
const LONDON = {"2026-08-14":20,"2026-08-15":45,"2026-08-16":45};
const DAYS = (()=>{const o=[],d=new Date("2026-08-12T12:00:00Z"),e=new Date("2026-09-11T12:00:00Z");
  while(d<=e){o.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);}return o;})();
const money = n => "\u00a3" + n.toFixed(2);
const lbl = s => new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"UTC"}).toUpperCase();
const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const dow  = s => new Date(s+"T12:00:00Z").getUTCDay();
const isWE = s => dow(s)===0 || dow(s)===6;
const lblWk = s => WD[dow(s)] + " " + s.slice(8,10);
const todayISO = () => { const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

const remote = !!(SUPABASE_URL && SUPABASE_KEY);
let log = {}, target = null, pinned = false, firstPaint = true, shownNum = null;
let draft = [];   // debts being entered for the current day: [{a, w}]

const amtOf  = d => log[d] ? log[d].a : undefined;
const debtsOf= d => (log[d] && Array.isArray(log[d].d)) ? log[d].d : [];
const owedOf = d => debtsOf(d).filter(x=>!x.s).reduce((s,x)=>s+(Number(x.a)||0),0);
const forOthers = d => debtsOf(d).reduce((s,x)=>s+(Number(x.a)||0),0);
const netOf  = d => log[d] ? Math.max(log[d].a - forOthers(d), 0) : undefined;

const sb = (path, opts={}) => fetch(SUPABASE_URL+"/rest/v1/"+path, {
  ...opts, headers:{apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json", Prefer:"resolution=merge-duplicates", ...(opts.headers||{})}});

function normalise(x){
  let d = [];
  if(Array.isArray(x.debts) && x.debts.length) d = x.debts.map(e=>({a:Number(e.a)||0, w:e.w||"", s:!!e.s}));
  else if(Number(x.owed) > 0) d = [{a:Number(x.owed), w:x.who||""}];   // migrate old single debt
  return {a:Number(x.amount), d};
}

async function load(){
  if(remote){
    const r = await sb("spend_days?select=day,amount,owed,who,debts");
    if(!r.ok) throw new Error("HTTP "+r.status);
    log = Object.fromEntries((await r.json()).map(x => [x.day, normalise(x)]));
  } else {
    const raw = JSON.parse(localStorage.getItem("spend-challenge") || "{}");
    log = Object.fromEntries(Object.entries(raw).map(([k,v]) =>
      [k, typeof v === "number" ? {a:v,d:[]} : (v.d ? v : {a:v.a, d:v.o>0?[{a:v.o,w:v.w||""}]:[]})]));
  }
}
async function persist(day, rec){
  const owed = rec.d.reduce((s,x)=>s+x.a,0);
  const who  = rec.d.length ? rec.d.map(x=>x.w).filter(Boolean).join(", ") : null;
  if(remote){
    const r = await sb("spend_days", {method:"POST",
      body:JSON.stringify({day, amount:rec.a, owed, who, debts:rec.d})});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else localStorage.setItem("spend-challenge", JSON.stringify(log));
}
async function remove(day){
  if(remote){
    const r = await sb("spend_days?day=eq."+day, {method:"DELETE"});
    if(!r.ok) throw new Error("HTTP "+r.status);
  } else localStorage.setItem("spend-challenge", JSON.stringify(log));
}

function engine(){
  let spent=0, skim=0, owed=0; const rows=[];
  for(const day of DAYS){
    const left = TOTAL - spent - skim;
    const ahead = DAYS.filter(d => d>=day && amtOf(d)===undefined);
    const lond = ahead.reduce((a,d)=>a+(LONDON[d]||0),0);
    const norm = ahead.filter(d=>!LONDON[d]).length;
    const allow = LONDON[day] ?? (norm>0 ? Math.max((left-lond)/norm,0) : 0);
    const net = netOf(day);
    if(net===undefined){ rows.push({day,allow,net:null}); continue; }
    const diff = allow - net;
    if(diff>0) skim += diff*0.3;
    spent += net;
    owed  += owedOf(day);
    rows.push({day, allow, net, diff, debts:debtsOf(day), owed:owedOf(day), paid:amtOf(day)});
  }
  const left = TOTAL - spent - skim;
  return {rows, spent, skim, left, owed, totalLeft: TARGET + skim + left, proj: TARGET + skim};
}

function streak(){
  const done = DAYS.filter(d=>amtOf(d)!==undefined);
  if(!done.length) return {n:0, broken:false};
  const last = done[done.length-1];
  let n=0, i=DAYS.indexOf(last);
  while(i>=0 && amtOf(DAYS[i])!==undefined){ n++; i--; }
  const t = todayISO();
  return {n, broken: DAYS.some(d => d < t && d < last && amtOf(d)===undefined)};
}

function nextUnlogged(){ return DAYS.find(d=>amtOf(d)===undefined) || DAYS[DAYS.length-1]; }

function rollTo(el, to){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const from = shownNum;
  shownNum = to;
  if(reduce || from===null || Math.abs(to-from) < 0.02){ el.firstChild.nodeValue = money(to); return; }
  el.classList.add("flick");
  setTimeout(()=>el.classList.remove("flick"), 460);
  const t0 = performance.now(), dur = 420;
  (function step(now){
    const p = Math.min((now-t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);
    el.firstChild.nodeValue = money(from + (to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}

function line(k, v, c, big){
  const col = c==="good"?"color:var(--good)":c==="bad"?"color:var(--bad)":c==="brass"?"color:var(--brass)":"";
  return `<div class="tot${big?" total":""}"><span class="k">${k}</span>
    <span class="dots"></span><span class="v" style="${col}">${v}</span></div>`;
}

// ---- draft rows (the people who owe you for the day being entered) ----
function renderDraft(){
  const box = document.getElementById("owedFields");
  box.innerHTML = draft.map((e,i)=>`
    <div class="owed-row">
      <label class="fld"><input class="dAmt" data-i="${i}" inputmode="decimal"
        placeholder="0.00" value="${e.a || ""}"></label>
      <label class="fld"><input class="dWho" data-i="${i}" maxlength="14"
        placeholder="who" value="${e.w || ""}"></label>
      <button class="drop" data-drop="${i}">\u00d7</button>
    </div>`).join("") +
    (draft.length ? `<button class="ghost mini" id="addRow">+ ADD ANOTHER PERSON</button>` : "");

  [...box.querySelectorAll(".dAmt")].forEach(el=>{
    el.oninput = () => { draft[+el.dataset.i].a = parseFloat(el.value.replace(",","."))||0; updateNote(); };
  });
  [...box.querySelectorAll(".dWho")].forEach(el=>{
    el.oninput = () => { draft[+el.dataset.i].w = el.value; };
  });
  [...box.querySelectorAll("[data-drop]")].forEach(b=>{
    b.onclick = () => { draft.splice(+b.dataset.drop,1); renderDraft(); updateNote();
      if(!draft.length) setOwedOpen(false); };
  });
  const add = document.getElementById("addRow");
  if(add) add.onclick = () => { draft.push({a:0,w:""}); renderDraft();
    [...box.querySelectorAll(".dAmt")].pop().focus(); };
  box.classList.toggle("on", draft.length>0);
}

function setOwedOpen(on){
  if(on && !draft.length) draft = [{a:0,w:""}];
  if(!on) draft = [];
  renderDraft();
  document.getElementById("owedToggle").textContent =
    draft.length ? "\u2212 CANCEL OWED" : "+ SOMEONE OWES ME";
  updateNote();
}

function draftTotal(){ return draft.reduce((s,e)=>s+(Number(e.a)||0),0); }

function updateNote(){
  const note = document.getElementById("owedNote");
  const a = parseFloat((document.getElementById("amt").value||"").replace(",","."));
  const o = draftTotal();
  if(draft.length && !isNaN(a) && o>0 && o<=a){
    note.style.display = "block";
    note.innerHTML = "COUNTS AS <strong>"+money(a-o)+"</strong> AGAINST BUDGET" +
      (draft.length>1 ? " \u00b7 "+draft.length+" PEOPLE" : "");
  } else note.style.display = "none";
}

function render(){
  const E = engine();
  if(!pinned) target = nextUnlogged();
  const row = E.rows.find(r=>r.day===target);
  const editing = amtOf(target)!==undefined;

  document.getElementById("heroLbl").textContent =
    (editing ? "EDITING \u00b7 " : "ALLOWANCE \u00b7 ") + lbl(target);

  const hero = document.getElementById("heroNum");
  if(!hero.firstChild || hero.firstChild.nodeType!==3) hero.textContent = money(row.allow);
  rollTo(hero, row.allow);
  let tag = hero.querySelector(".tag");
  if(LONDON[target]){
    if(!tag){ tag=document.createElement("span"); tag.className="tag"; hero.appendChild(tag); }
    tag.textContent = "LDN";
  } else if(tag) tag.remove();

  const done = E.rows.filter(r=>r.net!==null);
  const sched = done.reduce((a,r)=>a+r.diff,0);
  const st = streak();

  let html = [
    ["DAYS LOGGED", done.length + " / " + DAYS.length, ""],
    ["STREAK", st.n === 0 ? "\u2014" : st.n, st.broken ? "bad" : "brass"],
    ["SPENT", money(E.spent), ""],
    ["BUDGET LEFT", money(E.left), ""],
    ["SAVED SO FAR", money(E.skim), "good"],
    ["VS SCHEDULE", (sched>=0?"+":"\u2212")+money(Math.abs(sched)), sched>=0?"good":"bad"]
  ].map(([k,v,c])=>line(k,v,c)).join("");
  html += '<hr class="rule" style="margin:8px 0">';
  html += line("TOTAL LEFT", money(E.totalLeft), "", true);
  if(E.owed > 0){
    html += line("OWED TO YOU", money(E.owed), "brass");
    html += line("ON HAND", money(E.totalLeft - E.owed), "");
  }
  html += line("PROJECTED SAVED", money(E.proj), E.proj>=TARGET?"good":"bad");
  document.getElementById("totals").innerHTML = html;

  // one line per person, each settled on its own
  const open = [];
  E.rows.filter(r=>r.net!==null).forEach(r=>
    r.debts.forEach((e,i)=> { if(!e.s) open.push({day:r.day, i, a:e.a, w:e.w}); }));
  const wrap = document.getElementById("debtsWrap");
  wrap.style.display = open.length ? "block" : "none";
  document.getElementById("debtsCount").textContent =
    open.length>1 ? " \u00b7 "+open.length : "";
  document.getElementById("debts").innerHTML = open.map(o=>
    `<div class="debt"><span class="dd">${lbl(o.day)}</span>
      <span class="dw">${o.w || "\u2014"}</span>
      <span class="da">${money(o.a)}</span>
      <button data-settle="${o.day}" data-idx="${o.i}">SETTLE</button></div>`).join("");
  [...document.querySelectorAll("[data-settle]")].forEach(b=>{
    b.onclick = e => { e.stopPropagation(); settle(b.dataset.settle, +b.dataset.idx); };
  });

  document.getElementById("logBtn").textContent = editing ? "UPDATE" : "LOG";
  document.getElementById("clearBtn").style.display = editing ? "block" : "none";

  const t = todayISO();
  document.getElementById("ledger").innerHTML = E.rows.map((r,i)=>{
    const on = r.net!==null;
    const cls = ["day", on?(r.diff>=0?"ok":"over"):"future", r.day===t?"today":"",
                 r.day===target?"sel":"", (!on && r.day<t)?"miss":"", isWE(r.day)?"we":""].join(" ");
    const delay = firstPaint ? `animation-delay:${Math.min(i*18,420)}ms` : "";
    const mark = (on && r.debts.length) ?
      `<span class="mk">${"\u25E6".repeat(Math.min(r.debts.length,3))}</span>` : "";
    const val = on ? money(r.net)+mark : (r.day<t ? "MISSED" : "\u2014");
    return `<div class="${cls} ${firstPaint?"print":""}" style="${delay}" data-day="${r.day}">
      <span class="d">${lblWk(r.day)}</span>
      <span class="a">${money(r.allow)}</span>
      <span class="s">${val}</span></div>`;
  }).join("");
  firstPaint = false;

  [...document.querySelectorAll(".day")].forEach(el=>{
    el.onclick = () => {
      pinned = true; target = el.dataset.day;
      const rec = log[target];
      document.getElementById("amt").value = rec ? rec.a : "";
      draft = rec ? rec.d.map(e=>({a:e.a, w:e.w, s:e.s})) : [];
      renderDraft();
      document.getElementById("owedToggle").textContent =
        draft.length ? "\u2212 CANCEL OWED" : "+ SOMEONE OWES ME";
      render();
      document.getElementById("amt").focus();
    };
  });

  updateNote();
}

function say(msg, err){
  const el = document.getElementById("status");
  el.textContent = msg; el.className = "status" + (err?" err":"");
}

async function boot(){
  try{ await load(); renderDraft(); render();
    say((remote ? "SYNCED" : "THIS DEVICE") + " \u00b7 " + Object.keys(log).length + " DAYS ON FILE");
  }catch(e){ say("COULD NOT LOAD \u00b7 "+e.message, true); render(); }
}

document.getElementById("logBtn").onclick = async () => {
  const el = document.getElementById("amt");
  const a = parseFloat(el.value.replace(",","."));
  if(isNaN(a) || a<0) return say("ENTER A NUMBER", true);
  const d = draft.filter(e => (Number(e.a)||0) > 0).map(e=>({a:Number(e.a), w:(e.w||"").trim(), s:!!e.s}));
  const o = d.reduce((s,x)=>s+x.a,0);
  if(o > a) return say("OWED IS MORE THAN THE TOTAL", true);
  const day = target, prev = JSON.parse(JSON.stringify(log));
  log[day] = {a, d};
  render(); say("SAVING\u2026");
  try{
    await persist(day, log[day]);
    el.value=""; draft=[]; renderDraft(); setOwedOpen(false);
    pinned=false; render();
    say((remote?"SYNCED":"SAVED")+" \u00b7 "+lbl(day) +
        (d.length ? " \u00b7 "+money(o)+" OWED BY "+d.length : ""));
  }catch(e){ log = prev; render(); say("NOT SAVED \u00b7 "+e.message, true); }
};

async function settle(day, idx){
  const rec = log[day];
  if(!rec || !rec.d[idx]) return;
  const prev = JSON.parse(JSON.stringify(log));
  const e = rec.d[idx];
  e.s = true;
  render(); say("SETTLING\u2026");
  try{ await persist(day, rec);
    say("SETTLED \u00b7 "+money(e.a)+" BACK"+(e.w?" FROM "+e.w.toUpperCase():"")); }
  catch(err){ log = prev; render(); say("NOT SETTLED \u00b7 "+err.message, true); }
}

document.getElementById("clearBtn").onclick = async () => {
  const day = target;
  if(amtOf(day)===undefined) return;
  const prev = JSON.parse(JSON.stringify(log));
  delete log[day]; render(); say("CLEARING\u2026");
  try{ await remove(day);
    document.getElementById("amt").value=""; draft=[]; renderDraft(); setOwedOpen(false);
    pinned=false; render(); say("CLEARED \u00b7 "+lbl(day)); }
  catch(e){ log = prev; render(); say("NOT CLEARED \u00b7 "+e.message, true); }
};

document.getElementById("owedToggle").onclick = () => setOwedOpen(draft.length===0);

document.getElementById("todayBtn").onclick = () => {
  pinned = false;
  document.getElementById("amt").value = "";
  draft = []; renderDraft(); setOwedOpen(false);
  render();
  say("BACK TO NEXT UNLOGGED DAY");
};

document.getElementById("exp").onclick = () => {
  const d = document.getElementById("dlg");
  d.innerHTML = `<div style="font-size:11px;letter-spacing:.16em;margin-bottom:8px">BACKUP</div>
    <textarea readonly style="width:100%;height:130px;background:#E0DCD2;color:#1A1C1F;
      border:1px solid #1A1C1F;padding:8px;font-family:inherit;font-size:11px">${JSON.stringify(log)}</textarea>
    <button class="ghost" onclick="document.getElementById('dlg').close()">CLOSE</button>`;
  d.showModal();
};

document.getElementById("amt").addEventListener("input", updateNote);
document.getElementById("amt").addEventListener("keydown", e => {
  if(e.key==="Enter") document.getElementById("logBtn").click();
});

boot();

</script>
